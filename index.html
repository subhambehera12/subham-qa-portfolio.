<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Subham Behera | QA Engineer & SDET</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #080a11;
      --bg-surface: #0f1322;
      --bg-card: #151b2e;
      --bg-card-hover: #1c243d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --gradient-primary: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
      --border-light: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(139, 92, 246, 0.35);
      --shadow-glow: 0 0 25px rgba(139, 92, 246, 0.22);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: auto !important;
      height: auto;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
      overflow-y: visible !important;
      min-height: 100vh;
      position: relative;
    }

    /* Ambient Glow Background */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(6, 182, 212, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
    }

    /* Sticky Navigation */
    .site-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(8, 10, 17, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      z-index: 999;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand-logo .dot {
      color: var(--accent-cyan);
    }

    .nav-menu {
      display: flex;
      gap: 1.75rem;
      align-items: center;
    }

    .nav-menu a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      color: var(--text-main);
    }

    .btn-nav-cta {
      padding: 0.5rem 1.25rem;
      border-radius: 50px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--border-accent);
      color: #c4b5fd !important;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .btn-nav-cta:hover {
      background: var(--gradient-primary);
      color: #fff !important;
      border-color: transparent;
      box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      color: var(--text-main);
      padding: 0.4rem 0.75rem;
      font-size: 1.1rem;
      cursor: pointer;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Hero Section */
    .hero-section {
      padding: 4.5rem 0 3rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.45rem 1.15rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #6ee7b7;
      margin-bottom: 1.5rem;
    }

    .status-badge .indicator {
      width: 8px;
      height: 8px;
      background: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-emerald);
    }

    .hero-title {
      font-size: clamp(2.4rem, 6vw, 4.2rem);
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 1rem;
    }

    .gradient-text {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-subtitle {
      font-size: clamp(1.15rem, 2.8vw, 1.6rem);
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .typewriter-text {
      color: var(--accent-cyan);
      font-family: 'JetBrains Mono', monospace;
      border-right: 2px solid var(--accent-cyan);
      padding-right: 4px;
    }

    .hero-desc {
      max-width: 720px;
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2.25rem;
    }

    .hero-cta-group {
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 3rem;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.85rem;
      border-radius: 50px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: var(--transition);
      cursor: pointer;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: #fff;
      box-shadow: 0 8px 25px -5px rgba(139, 92, 246, 0.5);
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px -5px rgba(6, 182, 212, 0.6);
    }

    .btn-secondary {
      background: var(--bg-surface);
      color: var(--text-main);
      border: 1px solid var(--border-light);
    }

    .btn-secondary:hover {
      background: var(--bg-card);
      border-color: var(--border-accent);
      transform: translateY(-2px);
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.25rem;
      width: 100%;
      max-width: 950px;
    }

    .stat-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1.4rem 1.2rem;
      transition: var(--transition);
      position: relative;
    }

    .stat-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-3px);
    }

    .stat-number {
      font-size: 2.2rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: var(--accent-cyan);
      margin-bottom: 0.25rem;
    }

    .stat-label {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* Standard Sections */
    section {
      padding: 5rem 0;
      border-top: 1px solid var(--border-light);
    }

    .section-header {
      margin-bottom: 2.75rem;
    }

    .section-tag {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--accent-cyan);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 0.4rem;
      font-family: 'JetBrains Mono', monospace;
    }

    .section-title {
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      font-weight: 800;
      color: var(--text-main);
    }

    /* Skills Grid */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 1.5rem;
    }

    .skill-category-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 2rem 1.6rem;
      transition: var(--transition);
    }

    .skill-category-card:hover {
      border-color: var(--border-accent);
      background: var(--bg-card);
      transform: translateY(-4px);
    }

    .skill-icon-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.25rem;
    }

    .icon-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--border-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      color: var(--accent-cyan);
    }

    .skill-icon-header h3 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .pills-group {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    .skill-pill {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      padding: 0.4rem 0.85rem;
      border-radius: 30px;
      font-size: 0.85rem;
      color: #cbd5e1;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: var(--transition);
    }

    .skill-pill:hover {
      background: rgba(6, 182, 212, 0.12);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    /* Experience Timeline */
    .timeline-container {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    .timeline-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      overflow: hidden;
      transition: var(--transition);
    }

    .timeline-card:hover {
      border-color: rgba(139, 92, 246, 0.4);
    }

    .timeline-header {
      padding: 1.5rem 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
      background: rgba(21, 27, 46, 0.5);
    }

    .timeline-header-info h3 {
      font-size: 1.22rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .timeline-meta {
      display: flex;
      gap: 1rem;
      margin-top: 0.3rem;
      color: var(--text-muted);
      font-size: 0.88rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .timeline-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    .chevron-icon {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      transition: var(--transition);
    }

    .timeline-card.active .chevron-icon {
      transform: rotate(180deg);
      background: rgba(139, 92, 246, 0.2);
      color: var(--accent-cyan);
    }

    .timeline-content {
      display: none;
      padding: 1.4rem 1.8rem 1.8rem 1.8rem;
      border-top: 1px solid var(--border-light);
    }

    .timeline-card.active .timeline-content {
      display: block;
    }

    .qa-points {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
    }

    .qa-points li {
      position: relative;
      padding-left: 1.6rem;
      color: #cbd5e1;
      font-size: 0.95rem;
    }

    .qa-points li::before {
      content: '▹';
      position: absolute;
      left: 0;
      top: 0;
      color: var(--accent-cyan);
      font-weight: bold;
    }

    .qa-points li strong {
      color: #fff;
    }

    /* Projects */
    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 1.75rem;
    }

    .project-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 2rem 1.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: var(--transition);
    }

    .project-card:hover {
      transform: translateY(-5px);
      border-color: var(--border-accent);
      box-shadow: var(--shadow-glow);
    }

    .project-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .project-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-cyan);
      text-transform: uppercase;
      letter-spacing: 1px;
      font-family: 'JetBrains Mono', monospace;
    }

    .project-card h3 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      color: var(--text-main);
    }

    .project-card .project-role {
      font-size: 0.88rem;
      color: #c4b5fd;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    .project-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.25rem;
      line-height: 1.6;
    }

    .project-specs {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .project-specs li::before {
      content: '✔';
      color: var(--accent-emerald);
      margin-right: 0.5rem;
    }

    /* Education */
    .edu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    .edu-card {
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-md);
      padding: 1.75rem;
      display: flex;
      gap: 1.2rem;
      align-items: flex-start;
      transition: var(--transition);
    }

    .edu-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-3px);
    }

    .edu-badge {
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--border-accent);
      color: #c4b5fd;
      font-weight: 800;
      font-size: 1.05rem;
      padding: 0.7rem 1rem;
      border-radius: var(--radius-sm);
    }

    .edu-info h4 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.2rem;
    }

    .edu-info p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .edu-info span {
      display: inline-block;
      margin-top: 0.35rem;
      font-size: 0.82rem;
      color: var(--accent-cyan);
      font-weight: 600;
    }

    /* Contact Section */
    .contact-section {
      text-align: center;
    }

    .contact-box {
      max-width: 720px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 3.2rem 1.8rem;
    }

    .contact-box h2 {
      font-size: clamp(1.8rem, 3.5vw, 2.5rem);
      font-weight: 800;
      margin-bottom: 0.85rem;
    }

    .contact-box p {
      color: var(--text-muted);
      font-size: 1.02rem;
      margin-bottom: 1.8rem;
      max-width: 520px;
      margin-left: auto;
      margin-right: auto;
    }

    .contact-links-grid {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.8rem;
      flex-wrap: wrap;
    }

    .contact-card-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1.3rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-light);
      border-radius: 50px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 0.9rem;
      transition: var(--transition);
    }

    .contact-card-btn:hover {
      background: rgba(6, 182, 212, 0.15);
      border-color: var(--accent-cyan);
      color: #fff;
    }

    /* Footer */
    .site-footer {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2.2rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-light);
      color: var(--text-muted);
      font-size: 0.88rem;
    }

    .back-to-top {
      color: var(--text-muted);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
    }

    .back-to-top:hover {
      color: var(--accent-cyan);
    }

    /* Mobile Responsive */
    @media (max-width: 868px) {
      .nav-menu {
        display: none;
        position: fixed;
        top: 60px;
        left: 0;
        width:
