<html lang="en">
<head>
  <meta charset="UTF-8">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-dark: #080a11;
      --bg-surface: #0f1322;
      --bg-card: #151b2e;
      --bg-card-hover: #1c243d;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --gradient-primary: linear-gradient(135deg, #a855f7 0%, #06b6d4 100%);
      --border-light: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(139, 92, 246, 0.35);
      --shadow-glow: 0 0 25px rgba(139, 92, 246, 0.25);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
      overflow-x: hidden;
      overflow-y: auto !important;
      height: auto;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
      overflow-y: visible !important;
      min-height: 100vh;
      position: relative;
    }

    .ambient-glow {
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
      background: 
        radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 85% 60%, rgba(6, 182, 212, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 50% 90%, rgba(16, 185, 129, 0.05) 0%, transparent 40%);
    }

    /* Sticky Navbar */
    .site-header {
      position: sticky;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(8, 10, 17, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border-light);
      z-index: 999;
    }

    .nav-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-logo {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.5px;
    }

    .brand-logo .dot {
      color: var(--accent-cyan);
    }

    .nav-menu {
      display: flex;
      gap: 1.75rem;
      align-items: center;
    }

    .nav-menu a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 500;
      transition: var(--transition);
    }

    .nav-menu a:hover,
    .nav-menu a.active {
      color: var(--text-main);
    }

    .btn-nav-cta {
      padding: 0.5rem 1.2rem;
      border-radius: 50px;
      background: rgba(139, 92, 246, 0.15);
      border: 1px solid var(--border-accent);
      color: #c4b5fd !important;
      font-weight: 600;
      font-size: 0.88rem;
    }

    .btn-nav-cta:hover {
      background: var(--gradient-primary);
      color: #fff !important;
      border-color: transparent;
    }

    .mobile-toggle {
      display: none;
      background: none;
      border: none;
      color: var(--text-main);
      font-size: 1.4rem;
      cursor: pointer;
    }

    main {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* Hero Section */
    .hero-section {
      padding: 4.5rem 0 3rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      padding: 0.45rem 1.1rem;
      border-radius: 50px;
      font-size: 0.8rem;
      font-weight: 600;
      color: #6ee7b7;
      margin-bottom: 1.5rem;
    }
